<html>

        <link rel="stylesheet" href="index.css">

    <body>

            <h1>Follow the Course!</h1>
            <button id="Rules" onclick="RulesPage()">Rules</button>

        </div>

        <div class="Hidden" id="PlayGamePage">
            <h1>Welcome!</h1> 
            <button id="Escape" onclick="MainPage()">Escape</button>

                <button class="Start" onclick="Course1()">Level 1</button>
            </div>


        </div>


        <audio id="HomeScreenaudio" autoplay loop unmuted>
            <source src="the_mountain-retro-143303.mp3" type="audio/mp3">

        </audio>

    <script src="index.js"></script>
